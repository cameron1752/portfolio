<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Distributed weather forecasting architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1C2B39"/>
    </marker>
  </defs>

  <!-- background with faint isobar lines -->
  <rect x="0" y="0" width="1100" height="740" rx="18" fill="#EEF2F5"/>
  <g fill="none" stroke="#D5DEE6" stroke-width="1.5">
    <path d="M-20,620 C200,560 360,700 600,640 S960,560 1120,610"/>
    <path d="M-20,660 C220,600 380,735 620,680 S980,600 1120,650"/>
    <path d="M-20,100 C180,40 420,150 640,90 S940,20 1120,70"/>
  </g>

  <!-- title -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1C2B39">Distributed weather forecasting</text>
  <text x="40" y="72" font-size="14" fill="#4A5B6B">How raw weather data becomes a trained model, shared across four workers</text>

  <!-- ingestion row -->
  <text x="40" y="108" font-size="13" font-weight="700" fill="#2F6690">Data ingestion, run once</text>

  <g font-size="12.5" fill="#1C2B39">
    <rect x="40" y="120" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#2F6690" stroke-width="2"/>
    <text x="125" y="152" text-anchor="middle" font-size="15" font-weight="700">GRIB files</text>
    <text x="125" y="174" text-anchor="middle" fill="#4A5B6B">About 20 GB, hourly</text>
    <text x="125" y="190" text-anchor="middle" fill="#4A5B6B">for 32 months</text>

    <rect x="260" y="120" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#2F6690" stroke-width="2"/>
    <text x="360" y="152" text-anchor="middle" font-size="15" font-weight="700">NetCDF-Java loader</text>
    <text x="360" y="174" text-anchor="middle" fill="#4A5B6B">Converts to °F, hPa, mm</text>

    <rect x="520" y="120" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#2F6690" stroke-width="2"/>
    <text x="620" y="152" text-anchor="middle" font-size="15" font-weight="700">Staging table</text>
    <text x="620" y="174" text-anchor="middle" fill="#4A5B6B">Bulk loaded with COPY</text>

    <rect x="780" y="120" width="280" height="80" rx="10" fill="#FFFFFF" stroke="#2F6690" stroke-width="2"/>
    <text x="920" y="152" text-anchor="middle" font-size="15" font-weight="700">Transactional cutover</text>
    <text x="920" y="174" text-anchor="middle" fill="#4A5B6B">Removes duplicates, rebuilds the</text>
    <text x="920" y="190" text-anchor="middle" fill="#4A5B6B">unique index, rolls back on failure</text>
  </g>

  <g stroke="#1C2B39" stroke-width="1.8" fill="none">
    <path d="M210,160 H254" marker-end="url(#arrow)"/>
    <path d="M460,160 H514" marker-end="url(#arrow)"/>
    <path d="M720,160 H774" marker-end="url(#arrow)"/>
  </g>
  <text x="487" y="151" text-anchor="middle" font-size="11" fill="#4A5B6B">stream</text>

  <!-- docker compose boundary -->
  <rect x="20" y="228" width="1060" height="446" rx="16" fill="none" stroke="#7B8C9C" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="40" y="254" font-size="13" font-weight="700" fill="#4A5B6B">Docker Compose</text>

  <!-- postgres -->
  <rect x="300" y="250" width="500" height="130" rx="14" fill="#E3F1EF" stroke="#1F6F6B" stroke-width="2"/>
  <text x="550" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6F6B">PostgreSQL</text>
  <g font-size="12" fill="#1C2B39">
    <rect x="315" y="298" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="1.5"/>
    <text x="390" y="322" text-anchor="middle" font-weight="700" font-size="13">model_scaler</text>
    <text x="390" y="340" text-anchor="middle" fill="#4A5B6B">Shared feature scaling</text>

    <rect x="475" y="298" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="1.5"/>
    <text x="550" y="322" text-anchor="middle" font-weight="700" font-size="13">model_weights</text>
    <text x="550" y="340" text-anchor="middle" fill="#4A5B6B">Per worker, per round</text>

    <rect x="635" y="298" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="1.5"/>
    <text x="710" y="322" text-anchor="middle" font-weight="700" font-size="13">weather</text>
    <text x="710" y="340" text-anchor="middle" fill="#4A5B6B">About 200M rows</text>
  </g>

  <!-- cutover into weather table -->
  <path d="M920,200 V327 H791" stroke="#1C2B39" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- coordinator -->
  <rect x="40" y="430" width="230" height="220" rx="12" fill="#FBF0DD" stroke="#C77D1A" stroke-width="2"/>
  <g font-size="12.5" fill="#1C2B39">
    <text x="60" y="460" font-size="16" font-weight="700" fill="#8A5310">Coordinator</text>
    <text x="60" y="492">1. Initialize the weights</text>
    <text x="60" y="518">2. Fit the scaler with</text>
    <text x="76" y="534">Welford's algorithm</text>
    <text x="60" y="560">3. Wait for all four workers</text>
    <text x="60" y="586">4. Average their weights</text>
    <text x="60" y="612">5. Publish the merged model</text>
    <text x="76" y="628">for the next round</text>
  </g>

  <!-- scaler link -->
  <path d="M100,430 V392 H390 V362" stroke="#C77D1A" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="108" y="386" font-size="11.5" fill="#8A5310">writes scaling stats</text>

  <!-- shared bus between workers, coordinator, and tables -->
  <g stroke="#1C2B39" stroke-width="1.8" fill="none">
    <path d="M240,405 H960"/>
    <path d="M240,430 V405"/>
    <path d="M405,430 V405"/>
    <path d="M590,430 V405"/>
    <path d="M775,430 V405"/>
    <path d="M960,430 V405"/>
    <path d="M550,405 V362" marker-end="url(#arrow)"/>
    <path d="M710,405 V362" marker-end="url(#arrow)" transform="rotate(180 710 383.5)"/>
  </g>
  <text x="815" y="384" font-size="11.5" fill="#4A5B6B">Workers read data pages,</text>
  <text x="815" y="399" font-size="11.5" fill="#4A5B6B">then upload and pull weights</text>

  <!-- workers -->
  <g font-size="12" fill="#1C2B39">
    <rect x="320" y="430" width="170" height="220" rx="12" fill="#E4EEF7" stroke="#3A7CA5" stroke-width="2"/>
    <text x="405" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#245577">Worker 0</text>
    <text x="405" y="490" text-anchor="middle">Trains on pages where</text>
    <text x="405" y="507" text-anchor="middle" font-weight="700">page % 4 = 0</text>
    <text x="405" y="536" text-anchor="middle">Past 48 hours in,</text>
    <text x="405" y="553" text-anchor="middle">next 24 hours out</text>
    <text x="405" y="584" text-anchor="middle">Every 20 pages, uploads</text>
    <text x="405" y="601" text-anchor="middle">its weights and pulls</text>
    <text x="405" y="618" text-anchor="middle">the merged model</text>

    <rect x="505" y="430" width="170" height="220" rx="12" fill="#E4EEF7" stroke="#3A7CA5" stroke-width="2"/>
    <text x="590" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#245577">Worker 1</text>
    <text x="590" y="490" text-anchor="middle">Trains on pages where</text>
    <text x="590" y="507" text-anchor="middle" font-weight="700">page % 4 = 1</text>
    <text x="590" y="536" text-anchor="middle">Past 48 hours in,</text>
    <text x="590" y="553" text-anchor="middle">next 24 hours out</text>
    <text x="590" y="584" text-anchor="middle">Every 20 pages, uploads</text>
    <text x="590" y="601" text-anchor="middle">its weights and pulls</text>
    <text x="590" y="618" text-anchor="middle">the merged model</text>

    <rect x="690" y="430" width="170" height="220" rx="12" fill="#E4EEF7" stroke="#3A7CA5" stroke-width="2"/>
    <text x="775" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#245577">Worker 2</text>
    <text x="775" y="490" text-anchor="middle">Trains on pages where</text>
    <text x="775" y="507" text-anchor="middle" font-weight="700">page % 4 = 2</text>
    <text x="775" y="536" text-anchor="middle">Past 48 hours in,</text>
    <text x="775" y="553" text-anchor="middle">next 24 hours out</text>
    <text x="775" y="584" text-anchor="middle">Every 20 pages, uploads</text>
    <text x="775" y="601" text-anchor="middle">its weights and pulls</text>
    <text x="775" y="618" text-anchor="middle">the merged model</text>

    <rect x="875" y="430" width="170" height="220" rx="12" fill="#E4EEF7" stroke="#3A7CA5" stroke-width="2"/>
    <text x="960" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#245577">Worker 3</text>
    <text x="960" y="490" text-anchor="middle">Trains on pages where</text>
    <text x="960" y="507" text-anchor="middle" font-weight="700">page % 4 = 3</text>
    <text x="960" y="536" text-anchor="middle">Past 48 hours in,</text>
    <text x="960" y="553" text-anchor="middle">next 24 hours out</text>
    <text x="960" y="584" text-anchor="middle">Every 20 pages, uploads</text>
    <text x="960" y="601" text-anchor="middle">its weights and pulls</text>
    <text x="960" y="618" text-anchor="middle">the merged model</text>
  </g>

  <!-- network note -->
  <text x="40" y="706" font-size="13" fill="#1C2B39"><tspan font-weight="700">Network:</tspan> 150 inputs, hidden layers of 128, 64, and 32 with leaky ReLU, 24 outputs (one per forecast hour)</text>
</svg>
